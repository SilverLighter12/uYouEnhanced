name: Show required YouTube IPA version on Releases

on:
  schedule:
    - cron: '13 7 * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Auto-update uYouEnhanced and publish IPA
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: show-youtube-base-status
  cancel-in-progress: false

jobs:
  update-release-note:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Compare upstream requirement with stored YouTube.ipa
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/youtube-base-check"
          cd "${RUNNER_TEMP}/youtube-base-check"

          # Read the version explicitly stated in upstream's latest release notes.
          gh api repos/arichornlover/uYouEnhanced/releases/latest --jq '.body' > upstream-notes.md

          # The existing draft release contains the user's actual decrypted IPA.
          gh release download youtube-base -R "$TARGET_REPOSITORY" \
            --pattern 'YouTube.ipa' --dir .
          test -s YouTube.ipa

          # Read the latest published customized IPA release; do not create a release.
          gh api "repos/${TARGET_REPOSITORY}/releases/latest" > release.json

          python3 - <<'PY'
          import json
          import plistlib
          import re
          from pathlib import Path
          from zipfile import ZipFile

          upstream_notes = Path('upstream-notes.md').read_text(encoding='utf-8')
          match = re.search(
              r'Current\s+YouTube\s+Version\s*:\s*`?v?(\d+(?:\.\d+){1,3})',
              upstream_notes, flags=re.IGNORECASE
          )
          required = match.group(1) if match else None

          with ZipFile('YouTube.ipa') as ipa:
              app_plists = [name for name in ipa.namelist()
                            if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist', name)]
              if len(app_plists) != 1:
                  raise RuntimeError('Cannot identify exactly one app Info.plist in YouTube.ipa')
              info = plistlib.loads(ipa.read(app_plists[0]))
          if info.get('CFBundleIdentifier') != 'com.google.ios.youtube':
              raise RuntimeError('The stored source IPA is not the original YouTube app')
          installed = str(info.get('CFBundleShortVersionString') or info.get('CFBundleVersion') or '')
          if not re.fullmatch(r'\d+(?:\.\d+){1,3}', installed):
              raise RuntimeError(f'Unrecognized version inside stored YouTube.ipa: {installed!r}')

          def ver(version):
              parts = tuple(map(int, version.split('.')))
              return parts + (0,) * (4 - len(parts))

          if required is None:
              status = ('⚪ **Required YouTube IPA: unknown** — upstream release notes '
                        'do not specify a version. Check upstream before replacing your base IPA.')
          elif ver(required) > ver(installed):
              status = (f'⚠️ **NEW DECRYPTED YOUTUBE IPA NEEDED: {required}**  '
                        f'(stored: {installed}). Download YouTube {required} from iOSGods '
                        'and replace `YouTube.ipa` in your `youtube-base` draft release.')
          else:
              status = (f'✅ **YouTube base IPA current: {installed}**  '
                        f'(latest upstream release requires {required}).')

          release = json.loads(Path('release.json').read_text(encoding='utf-8'))
          old_body = release.get('body') or ''
          start = '<!-- YOUTUBE_BASE_STATUS_BEGIN -->'
          end = '<!-- YOUTUBE_BASE_STATUS_END -->'
          old_body = re.sub(re.escape(start) + r'.*?' + re.escape(end) + r'\s*',
                            '', old_body, flags=re.DOTALL)
          new_body = f'{start}\n{status}\n{end}\n\n{old_body.strip()}'.rstrip() + '\n'
          Path('update.json').write_text(json.dumps({'body': new_body}), encoding='utf-8')
          Path('release-id.txt').write_text(str(release['id']), encoding='utf-8')
          print(status)
          PY

          gh api --method PATCH \
            "repos/${TARGET_REPOSITORY}/releases/$(cat release-id.txt)" \
            --input update.json --silent
